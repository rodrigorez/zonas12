<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <base href="../">
    <title>Comparativo de fundo 360º — p5.js</title>
    <link rel="stylesheet" href="teste/comparativo.css?v=2">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  </head>
  <body data-tech="p5">
    <div id="container-video"><video id="camera" autoplay playsinline muted></video></div>
    <div id="container-3d">
      <script>
        const aa = new URLSearchParams(location.search).get('aa') !== '0';
        document.write('<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: ' +
          aa + '; stencil: true;"><a-entity position="0 1.6 0"><a-camera look-controls="enabled: false"></a-camera></a-entity></a-scene>');
      </script>
    </div>
    <section id="panel">
      <h1>Comparativo 360º — <span id="tech"></span></h1>
      <p><a href="teste/shader/index01.htm">Shader</a> · <a href="teste/img/index01.htm">Imagem</a> · <a href="teste/p5js.htm">p5.js</a></p>
      <label>Celular <input id="device-label" placeholder="Informe uma vez: ex. V3 - GE8320"></label>
      <div class="actions">
        <button id="camera-button">1. Ligar câmera</button>
        <button id="run-static" disabled>2. Teste 1 — estático</button>
        <button id="run-animated" disabled>3. Teste 2 — animado</button>
        <button id="copy" disabled>4. Copiar dados</button>
      </div>
      <p class="note">Use o mesmo celular, câmera, pixelRatio e antialias nas três tecnologias. Cada teste faz 3 medições.</p>
      <p id="status" role="status">Carregando cenário…</p>
      <p id="page-url"></p>
      <section id="analysis" aria-live="polite">
        <h2>Análise dos resultados</h2>
        <p id="analysis-current"></p>
        <p id="analysis-history"></p>
      </section>
      <details>
        <summary>Ver log JSON</summary>
        <textarea id="log" readonly aria-label="Resultados JSON"></textarea>
      </details>
    </section>
    <script type="module" src="teste/comparativo.js?v=2"></script>
  </body>
</html>
