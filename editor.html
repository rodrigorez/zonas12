<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A mesma raiz da publicação que o arranque da exposição (D28): é ela que resolve `data/worlds/`,
         `js/editor.js` e `css/editor.css`. O editor é uma ferramenta, não um mundo: não tem slug. -->
    <base href="./" />
    <title data-i18n="editor.title">Editor da exposição</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <link rel="stylesheet" href="css/editor.css" />
    <script type="module" src="js/editor.js"></script>
  </head>

  <body>
    <header id="barra">
      <h1 data-i18n="editor.title">Editor da exposição</h1>

      <div class="grupo">
        <label for="mundo" data-i18n="editor.world.label">Mundo</label>
        <input
          id="mundo"
          type="text"
          list="mundos"
          value="gate"
          spellcheck="false"
          autocomplete="off"
          data-i18n-title="editor.world.hint"
          title="O slug de um mundo é o nome do ficheiro em data/worlds/"
        />
        <datalist id="mundos"></datalist>
        <button type="button" id="abrir" data-i18n="editor.world.open">Abrir</button>
      </div>

      <div class="grupo">
        <button
          type="button"
          id="desfazer"
          data-i18n="editor.undo"
          data-i18n-title="editor.undo.hint"
          title="Volta ao estado anterior (Ctrl+Z)"
          disabled
        >
          Desfazer
        </button>
        <!-- A marca de «alterado» (D32/D35): o mundo em memória deixou de ser o ficheiro de onde veio.
             Fica ao lado do botão que a desfaz, que é onde a mão já está. -->
        <span id="alterado" class="marca" data-i18n="editor.dirty" hidden>alterado</span>
        <button type="button" id="validar" data-i18n="editor.validate">Validar</button>
        <!-- O «Gravar» da Fase 5 (D49): só existe quando o servidor da ferramenta responde a
             `GET /api/ping` — numa página publicada ele nunca aparece e o «Exportar» fica igual. -->
        <button
          type="button"
          id="gravar"
          data-i18n="editor.save"
          data-i18n-title="editor.save.hint"
          title="Grava o mundo em data/worlds/ (só existe com o servidor da ferramenta)"
          hidden
        >
          Gravar
        </button>
        <button type="button" id="exportar" data-i18n="editor.export">Exportar</button>
        <!-- O input fica coberto pela etiqueta: o rato e o teclado chegam-lhe, e o texto continua a
             ser uma chave do catálogo (D12). `display: none` tirá-lo-ia da ordem de foco. -->
        <label class="ficheiro">
          <input type="file" id="importar" accept="application/json,.json" />
          <span data-i18n="editor.import">Importar JSON</span>
        </label>
      </div>
    </header>

    <main>
      <section id="lado">
        <p id="estado" role="status" aria-live="polite"></p>

        <div id="paineis"></div>

        <h2 data-i18n="editor.problems.title">Problemas</h2>
        <p id="contagens"></p>
        <ul id="problemas"></ul>
      </section>

      <section id="pre-visualizacao" aria-label="Pré-visualização">
        <!-- A mesma cena do arranque da exposição, menos o cursor e o raycaster: no editor caminha-se,
             não se visita — e sem fonte de cliques nenhuma obra tenta abrir um modal que aqui não existe
             (R13). O `stencil` é obrigatório (lei L6) e o `ar-config` confirma-o. -->
        <a-scene ar-config renderer="alpha: true; antialias: true; stencil: true;">
          <a-assets></a-assets>
        </a-scene>
      </section>
    </main>
  </body>
</html>
