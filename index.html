<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Portal AR – Galeria Imersiva com Controlos Mobile</title>
    <link rel="icon" href="data:,">
    
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
  </head>
  
  <body>
    <!-- Loading indicator -->
    <div class="loading-overlay" id="loading-overlay">
      Carregando...
    </div>

    <!-- OVERLAY: Janela Modal -->
    <div id="modal-obra">
      <button onclick="fecharObra()">Voltar para a Galeria</button>
      <iframe id="iframe-obra" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Interface Inicial -->
    <button id="btn-iniciar" onclick="iniciarCena()">ATIVAR EXPOSIÇÃO</button>

    <!-- CONTROLOS MOBILE (Só aparecem se for smartphone/tablet) -->
    <div id="controles-mobile">
      <div id="btn-frente" class="dpad-btn">▲</div>
      <div id="btn-tras" class="dpad-btn">▼</div>
      <div id="btn-esq" class="dpad-btn">◄</div>
      <div id="btn-dir" class="dpad-btn">►</div>
    </div>

    <!-- Fundo de Câmera -->
    <div id="container-video">
      <video id="webcam-video" autoplay playsinline muted></video>
    </div>

    <!-- Cena A-Frame -->
    <div id="container-3d">
      <!-- renderer: o stencil é obrigatório para o portal (buffer de stencil) -->
      <a-scene config-ar gestor-dimensoes renderer="alpha: true; antialias: true; stencil: true;" cursor="rayOrigin: mouse" raycaster="objects: .interactable">
        
        <a-assets>
          <img id="cidade-360" src="assets/images/forest.jpg" crossorigin="anonymous">
          <img id="galeriaFoto1" src="assets/images/bryan-goff-IuyhXAia8EA-unsplash.jpg" crossorigin="anonymous">
          <img id="galeriaFoto2" src="assets/images/eiffel.jpg" crossorigin="anonymous">
          <img id="praia" src="assets/images/praia.jpg" crossorigin="anonymous">
          <img id="skycloud" src="assets/images/skycloud.jpg" crossorigin="anonymous">
          <video id="video" src="assets/images/compequicolor1024vr.mp4" crossorigin="anonymous" autoplay loop="true" muted></video>
        </a-assets>

        <!-- Câmera e Cursor -->
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 45;">
          <a-cursor color="#ffffff" opacity="0.8" objects=".interactable"></a-cursor>
        </a-camera>

        <!-- Dimensões (uma entidade por dimensão, com o seu ID) -->
        <!-- O panorama de uma dimensão é o fundo 360º dela. O portal é só a porta. -->
        <!-- O panorama de uma dimensão é o fundo 360º dela. O portal é só a porta.
             O raio tem de ser maior do que a distância a qualquer portal: o fundo da
             dimensão ativa tem de estar sempre atrás do plano das janelas. -->
        <a-entity panorama-dimensao="dimensao: 1; src: #cidade-360; raio: 500;"></a-entity>
        <a-entity panorama-dimensao="dimensao: 2; src: #praia; raio: 500;"></a-entity>
        <a-entity panorama-dimensao="dimensao: 3; src: #skycloud; raio: 500;"></a-entity>

        <!-- As dimensões 0, 1 e 2 formam um grafo completo (2 portais cada, um para cada
             uma das outras). A dimensão 2 tem 3 portais (dois para a 1 e um para a 3) e
             a dimensão 3 tem 1 portal de volta para a 2. -->

        <!-- Portais da dimensão 0 (realidade / hub) -->
        <a-entity position="-6 0 -8" portal-estencil-dinamico="portalId: 0; dimensaoA: 0; dimensaoB: 1; pertenceA: 0; width: 8; height: 10;"></a-entity>
        <a-entity position=" 6 0 -8" portal-estencil-dinamico="portalId: 1; dimensaoA: 0; dimensaoB: 2; pertenceA: 0; width: 8; height: 10;"></a-entity>

        <!-- Portais da dimensão 1 (cidade 360º) -->
        <a-entity position="-25 0 -45" portal-estencil-dinamico="portalId: 2; dimensaoA: 1; dimensaoB: 0; pertenceA: 1; width: 10; height: 12;"></a-entity>
        <a-entity position=" 25 0 -45" portal-estencil-dinamico="portalId: 3; dimensaoA: 1; dimensaoB: 2; pertenceA: 1; width: 10; height: 12;"></a-entity>

        <!-- Portais da dimensão 2 (praia): 3 portais em fila — 2 para a dimensão 1 e
             1 para a dimensão 3. Os dois que vão para a dimensão 1 mostram a mesma
             dimensão, logo partilham o mesmo valor de stencil. -->
        <a-entity position="-25 0 -80" portal-estencil-dinamico="portalId: 4; dimensaoA: 2; dimensaoB: 1; pertenceA: 2; width: 10; height: 12;"></a-entity>
        <a-entity position="  0 0 -80" portal-estencil-dinamico="portalId: 6; dimensaoA: 2; dimensaoB: 3; pertenceA: 2; width: 10; height: 12;"></a-entity>
        <a-entity position=" 25 0 -80" portal-estencil-dinamico="portalId: 5; dimensaoA: 2; dimensaoB: 1; pertenceA: 2; width: 10; height: 12;"></a-entity>

        <!-- Portais da dimensão 3 (céu 360º) -->
        <a-entity position="0 0 -120" portal-estencil-dinamico="portalId: 7; dimensaoA: 3; dimensaoB: 2; pertenceA: 3; width: 10; height: 12;"></a-entity>

        <!-- Obras da dimensão 1 (cidade 360º), em Z = -60 -->
        <a-entity position="0 0 -60">
          
          <a-box 
            class="interactable"
            material-virtual="dimensao: 1" src="#galeriaFoto1" position="-44 1.5 5" rotation="0 15 0" width="4" height="3" depth="0.1"
            abrir-modal="url: assets/images/bryan-goff-IuyhXAia8EA-unsplash.jpg">
          </a-box>

          <a-box 
            class="interactable"
            material-virtual="dimensao: 1" src="#galeriaFoto2" position="-24 1.5 5" width="4" height="3" depth="0.1"
            abrir-modal="url: assets/images/eiffel.jpg">
          </a-box>

          <a-box 
            class="interactable"
            material-virtual="dimensao: 1" src="#video" position="4 1.5 5" rotation="0 -15 0" width="4" height="3" depth="0.1"
            abrir-modal="url: assets/images/compequicolor1024vr.mp4">
          </a-box>

          <a-box 
            class="interactable"
            material-virtual="dimensao: 1" src="#praia" position="24 1.5 5" width="4" height="3" depth="0.1"
            abrir-modal="url: assets/images/praia.jpg">
          </a-box>

          <a-box 
            class="interactable"
            material-virtual="dimensao: 1" src="#skycloud" position="44 1.5 5" width="4" height="3" depth="0.1"
            abrir-modal="url: assets/images/skycloud.jpg">
          </a-box>

        </a-entity>

        <!-- Obras da dimensão 2 (praia), mais fundo: cada dimensão tem o seu conteúdo -->
        <a-entity position="0 0 -95">

          <a-box 
            class="interactable"
            material-virtual="dimensao: 2" src="#skycloud" position="-20 1.5 5" width="4" height="3" depth="0.1"
            abrir-modal="url: assets/images/skycloud.jpg">
          </a-box>

          <a-box 
            class="interactable"
            material-virtual="dimensao: 2" src="#galeriaFoto2" position="0 1.5 5" width="4" height="3" depth="0.1"
            abrir-modal="url: assets/images/eiffel.jpg">
          </a-box>

          <a-box 
            class="interactable"
            material-virtual="dimensao: 2" src="#galeriaFoto1" position="20 1.5 5" width="4" height="3" depth="0.1"
            abrir-modal="url: assets/images/bryan-goff-IuyhXAia8EA-unsplash.jpg">
          </a-box>

        </a-entity>

        <!-- Obras da dimensão 3 (céu 360º), em Z = -110: ficam à frente do portal de
             volta (Z = -120), para se poder vê-las e clicá-las antes de voltar -->
        <a-entity position="0 0 -115">

          <a-box 
            class="interactable"
            material-virtual="dimensao: 3" src="#praia" position="-15 1.5 5" width="4" height="3" depth="0.1"
            abrir-modal="url: assets/images/praia.jpg">
          </a-box>

          <a-box 
            class="interactable"
            material-virtual="dimensao: 3" src="#cidade-360" position="15 1.5 5" width="4" height="3" depth="0.1"
            abrir-modal="url: assets/images/forest.jpg">
          </a-box>

        </a-entity>
      </a-scene>
    </div>

    <script>
      function iniciarCena() {
        // Mostrar indicador de carregamento
        const loadingOverlay = document.getElementById('loading-overlay');
        if (loadingOverlay) {
          loadingOverlay.style.display = 'flex';
        }
        
        document.getElementById('btn-iniciar').style.display = 'none';
        var video = document.getElementById('webcam-video');
        
        // Verifica se é dispositivo móvel para ativar a UI de botões
        if (AFRAME.utils.device.isMobile()) {
          document.getElementById('controles-mobile').style.display = 'block';
          configurarBotoesMobile(); // Inicia os ouvintes de toque
        }

        if (navigator.mediaDevices?.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'environment' } })
            .then(stream => {
              video.srcObject = stream;
              video.play();
              setTimeout(() => {
                let scene = document.querySelector('a-scene');
                if (scene?.resize) scene.resize();
              }, 300);
              
              // Esconder indicador de carregamento após um curto delay
              setTimeout(() => {
                if (loadingOverlay) {
                  loadingOverlay.style.display = 'none';
                }
              }, 500);
            })
            .catch(error => {
              tratarErroCamera(error);
            });
        } else {
          tratarErroCamera(new Error("getUserMedia not supported"));
        }
      }
    </script>
  </body>
</html>
